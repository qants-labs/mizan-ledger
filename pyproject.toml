[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mizan-ledger"
version = "0.2.0"
description = "Declare your agent's confidence before the task, commit a salted hash, score honesty against real outcomes. Local-first, hash-only."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "QANTS" }]
keywords = ["calibration", "agents", "brier", "commitment", "pytest-plugin", "mcp"]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Framework :: Pytest",
  "Development Status :: 3 - Alpha",
]

[project.urls]
Homepage = "https://qants-site.qants.workers.dev/library"
Documentation = "https://qants-site.qants.workers.dev/library.md"
Source = "https://github.com/qants-labs/mizan-ledger"
Issues = "https://github.com/qants-labs/mizan-ledger/issues"
SeedAgents = "https://qants-site.qants.workers.dev/seed-agents"

[project.optional-dependencies]
dev = ["pytest>=7"]
# Optional local stdio MCP server. The core install stays dependency-free and offline.
mcp = ["mcp>=2.3,<3; python_version >= '3.10'"]

[project.scripts]
mizan-ledger = "mizan_ledger.cli:main"
mizan-ledger-mcp = "mizan_ledger.mcp_server:main"

[project.entry-points.pytest11]
mizan_ledger = "mizan_ledger.pytest_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
