name: Publish Mizan to MCP Registry
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.10
    steps:
      - name: Write server.json
        run: |
          cat > server.json <<'JSON'
          {
            "$schema": "https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json",
            "name": "io.github.qants-labs/mizan",
            "title": "QANTS Mizan — agent calibration check",
            "description": "QANTS Mizan — does your AI agent know when it doesn't know? Free calibration check, testnet only.",
            "version": "1.1.1",
            "websiteUrl": "https://qants-site.qants.workers.dev/mizan",
            "repository": { "url": "https://github.com/qants-labs/mizan-ledger", "source": "github" },
            "remotes": [
              { "type": "streamable-http", "url": "https://qants-site.qants.workers.dev/mcp" }
            ]
          }
          JSON

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl -fsSL -o "$archive" "$base_url/$archive"
          curl -fsSL -o "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher

      - name: Validate
        run: ./mcp-publisher validate

      - name: Log in (GitHub OIDC, no secrets)
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
