# Copy to .github/workflows/mizan-gate.yml in YOUR repository (this repository has no CI of its own).
# It runs your tests with @pytest.mark.confidence(p) declarations and fails the job if calibration gets
# worse than the committed baseline by more than the allowed delta. No secrets, no network beyond installing packages.
name: mizan-gate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  calibration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: qants-labs/mizan-ledger@main   # pin to a release tag or commit SHA once one is published
        with:
          baseline: mizan-baseline.json       # create once: mizan-ledger gate .mizan --write-baseline
          max-brier-delta: "0.02"
          min-n: "50"
          agent-id: my-agent
