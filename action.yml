name: "Mizan calibration gate"
description: "Run your tests with mizan-ledger confidence declarations and fail CI if calibration (Brier) gets worse beyond a set delta."
author: "QANTS"
branding:
  icon: "check-circle"
  color: "blue"

inputs:
  python-version:
    description: "Python version to set up"
    default: "3.12"
  ledger-dir:
    description: "Directory for the ledger written by this run"
    default: ".mizan"
  baseline:
    description: "Baseline file committed to your repository (create it with: mizan-ledger gate <dir> --write-baseline)"
    default: "mizan-baseline.json"
  max-brier-delta:
    description: "Allowed worsening of the Brier score before the gate fails"
    default: "0.02"
  min-n:
    description: "Minimum resolved declarations; below this the gate warns (exit 2) instead of passing or failing"
    default: "50"
  agent-id:
    description: "Agent id recorded in the ledger"
    default: "ci-agent"
  agent-version:
    description: "Agent version recorded in the ledger"
    default: "${{ github.sha }}"
  pytest-args:
    description: "Extra arguments for pytest (e.g. a test path)"
    default: ""
  fail-on-inconclusive:
    description: "Set to 'true' to fail the job when the gate is inconclusive (exit 2). Default: warn only."
    default: "false"

outputs:
  result:
    description: "pass | fail | inconclusive"
    value: ${{ steps.gate.outputs.result }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install mizan-ledger (from this action's own source, same version as the action)
      shell: bash
      run: python -m pip install -q "${{ github.action_path }}" pytest

    - name: Run tests with confidence declarations
      id: tests
      shell: bash
      env:
        MIZAN_DIR: ${{ inputs.ledger-dir }}
        MIZAN_AGENT: ${{ inputs.agent-id }}
        MIZAN_VERSION: ${{ inputs.agent-version }}
        PYTEST_ARGS: ${{ inputs.pytest-args }}
      run: |
        set +e
        python -m pytest --mizan-ledger-dir "$MIZAN_DIR" --mizan-agent-id "$MIZAN_AGENT" --mizan-agent-version "$MIZAN_VERSION" $PYTEST_ARGS
        echo "code=$?" >> "$GITHUB_OUTPUT"

    - name: Calibration gate
      id: gate
      shell: bash
      env:
        MIZAN_DIR: ${{ inputs.ledger-dir }}
        MIZAN_BASELINE: ${{ inputs.baseline }}
        MIZAN_DELTA: ${{ inputs.max-brier-delta }}
        MIZAN_MIN_N: ${{ inputs.min-n }}
        MIZAN_AGENT: ${{ inputs.agent-id }}
        MIZAN_VERSION: ${{ inputs.agent-version }}
        FAIL_INCONCLUSIVE: ${{ inputs.fail-on-inconclusive }}
      run: |
        set +e
        mizan-ledger gate "$MIZAN_DIR" --baseline "$MIZAN_BASELINE" --max-brier-delta "$MIZAN_DELTA" --min-n "$MIZAN_MIN_N" \
          --agent "$MIZAN_AGENT" --version "$MIZAN_VERSION" --summary-md "$GITHUB_STEP_SUMMARY"
        code=$?
        case "$code" in
          0) echo "result=pass" >> "$GITHUB_OUTPUT" ;;
          1) echo "result=fail" >> "$GITHUB_OUTPUT"; echo "::error title=Mizan calibration gate::calibration got worse beyond the allowed delta (see job summary)" ;;
          2) echo "result=inconclusive" >> "$GITHUB_OUTPUT"; echo "::warning title=Mizan calibration gate::inconclusive (too few resolved declarations or no baseline); see job summary"
             if [ "$FAIL_INCONCLUSIVE" = "true" ]; then exit 1; fi; code=0 ;;
          *) echo "result=fail" >> "$GITHUB_OUTPUT" ;;
        esac
        exit "$code"

    - name: Fail if the tests failed
      if: steps.tests.outputs.code != '0'
      shell: bash
      run: |
        echo "::error title=Tests::pytest exited with ${{ steps.tests.outputs.code }}"
        exit 1
