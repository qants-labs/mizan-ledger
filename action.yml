name: "QANTS Mizan — agent calibration check"
description: "Fail CI when your agent gets more confident-and-wrong: Brier and overconfident-wrong share vs a committed baseline."
author: "QANTS"
branding:
  icon: "check-circle"
  color: "blue"

inputs:
  python-version:
    description: "Python version to set up"
    default: "3.12"
  ledger-dir:
    description: "Directory for the ledger written by the pytest step (used when jsonl is empty)"
    default: ".mizan"
  jsonl:
    description: "Optional JSONL file written by your own eval harness ({id, confidence 0..1 or null, correct} per line). When set, the pytest step is skipped and the gate reads this file."
    default: ""
  baseline:
    description: "Baseline file. If it is committed to your repository it is used as is; otherwise it is kept in the Actions cache (saved on pushes to the default branch, restored on pull requests)."
    default: "mizan-baseline.json"
  max-brier-delta:
    description: "Allowed worsening of the Brier score (QANTS starting value, not an industry standard)"
    default: "0.02"
  max-ocw-delta:
    description: "Allowed rise of the overconfident-wrong share (QANTS starting value, not an industry standard)"
    default: "0.02"
  min-n:
    description: "Minimum answered items; below this the gate reports 'not enough data', shows no score and passes"
    default: "50"
  agent-id:
    description: "Agent id recorded in the ledger"
    default: "ci-agent"
  agent-version:
    description: "Agent version recorded in the ledger"
    default: "${{ github.sha }}"
  pytest-args:
    description: "Extra arguments for pytest (e.g. a test path)"
    default: ""
  strict:
    description: "Set to 'true' to fail the job when there is no baseline yet (exit 2). Default: create it and pass."
    default: "false"

outputs:
  result:
    description: "pass | fail | not enough data | baseline created"
    value: ${{ steps.gate.outputs.result }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install mizan-ledger (from this action's own source, same version as the action)
      shell: bash
      run: python -m pip install -q "${{ github.action_path }}" pytest

    - name: Run tests with confidence declarations
      id: tests
      if: inputs.jsonl == ''
      shell: bash
      env:
        MIZAN_DIR: ${{ inputs.ledger-dir }}
        MIZAN_AGENT: ${{ inputs.agent-id }}
        MIZAN_VERSION: ${{ inputs.agent-version }}
        PYTEST_ARGS: ${{ inputs.pytest-args }}
      run: |
        set +e
        python -m pytest --mizan-ledger-dir "$MIZAN_DIR" --mizan-agent-id "$MIZAN_AGENT" --mizan-agent-version "$MIZAN_VERSION" $PYTEST_ARGS
        echo "code=$?" >> "$GITHUB_OUTPUT"

    - name: Baseline source (committed file, or the Actions cache)
      id: base
      shell: bash
      env:
        MIZAN_BASELINE: ${{ inputs.baseline }}
      run: |
        if git ls-files --error-unmatch "$MIZAN_BASELINE" >/dev/null 2>&1; then
          echo "committed=true" >> "$GITHUB_OUTPUT"; echo "baseline: committed file $MIZAN_BASELINE"
        else
          echo "committed=false" >> "$GITHUB_OUTPUT"; echo "baseline: Actions cache"
        fi

    - name: Restore the latest baseline for this agent (pull requests)
      if: github.event_name == 'pull_request' && steps.base.outputs.committed != 'true'
      uses: actions/cache/restore@v4
      with:
        path: ${{ inputs.baseline }}
        key: mizan-baseline-${{ inputs.agent-id }}-pr-${{ github.run_id }}
        restore-keys: |
          mizan-baseline-${{ inputs.agent-id }}-

    - name: Calibration gate
      id: gate
      shell: bash
      env:
        MIZAN_INPUT: ${{ inputs.jsonl != '' && inputs.jsonl || inputs.ledger-dir }}
        MIZAN_BASELINE: ${{ inputs.baseline }}
        MIZAN_DELTA: ${{ inputs.max-brier-delta }}
        MIZAN_OCW_DELTA: ${{ inputs.max-ocw-delta }}
        MIZAN_MIN_N: ${{ inputs.min-n }}
        MIZAN_AGENT: ${{ inputs.agent-id }}
        MIZAN_VERSION: ${{ inputs.agent-version }}
        MIZAN_STRICT: ${{ inputs.strict }}
        MIZAN_JSONL: ${{ inputs.jsonl }}
      run: |
        set +e
        args=(gate "$MIZAN_INPUT" --baseline "$MIZAN_BASELINE" --max-brier-delta "$MIZAN_DELTA" --max-ocw-delta "$MIZAN_OCW_DELTA" \
              --min-n "$MIZAN_MIN_N" --summary-md "$GITHUB_STEP_SUMMARY")
        if [ -z "$MIZAN_JSONL" ]; then args+=(--agent "$MIZAN_AGENT" --version "$MIZAN_VERSION"); fi
        if [ "$MIZAN_STRICT" = "true" ]; then args+=(--strict); fi
        mizan-ledger "${args[@]}" > "$RUNNER_TEMP/mizan-gate.json"
        code=$?
        cat "$RUNNER_TEMP/mizan-gate.json"
        result=$(python -c "import json,sys; print(json.load(open(sys.argv[1])).get('result',''))" "$RUNNER_TEMP/mizan-gate.json")
        echo "result=$result" >> "$GITHUB_OUTPUT"
        case "$code" in
          0) [ "$result" = "pass" ] || echo "::notice title=Mizan calibration gate::$result (see job summary)" ;;
          1) echo "::error title=Mizan calibration gate::calibration got worse beyond the thresholds, or the input does not verify (see job summary)" ;;
          2) echo "::error title=Mizan calibration gate::no baseline yet and strict mode is on; a baseline was created, commit it" ;;
        esac
        exit "$code"

    - name: Save this run's baseline for this agent (pushes to the default branch)
      if: >-
        always() && github.event_name == 'push' && steps.base.outputs.committed != 'true' &&
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
        hashFiles(inputs.baseline) != ''
      uses: actions/cache/save@v4
      with:
        path: ${{ inputs.baseline }}
        key: mizan-baseline-${{ inputs.agent-id }}-${{ github.run_id }}

    - name: Fail if the tests failed
      if: inputs.jsonl == '' && steps.tests.outputs.code != '0'
      shell: bash
      run: |
        echo "::error title=Tests::pytest exited with ${{ steps.tests.outputs.code }}"
        exit 1
