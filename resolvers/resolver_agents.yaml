# Separation between resolving/checking and predicting (hardening v1 T4, founder decisions 26 Nov 2026).
# Resolution is done by a separate, non-rated resolver process. Its identities (plus checker identities) are listed
# here. An identity on this list never submits predictions or enters rankings; if an answer from one of them ever
# appears in an external log, it is flagged and excluded from Brier and ratings. A1, A2, and free-LLM baselines
# stay rated baselines and are never resolvers.
version: 1.1.0
resolver_agents: [mizan-resolver-primary, mizan-resolver-rerun]
checker_agents: [mizan-checker, qants-checker]
rated_baselines_never_resolvers: [qants-a1, qants-a2, qants-blockchain-first-principles, qants-baseline-free-llm-a, qants-baseline-free-llm-b]
